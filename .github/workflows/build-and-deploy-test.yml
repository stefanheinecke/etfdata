name: Build and deploy test images

on:
  push:
    branches:
      - main

concurrency:
  group: ghcr-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy-test:
    needs: build
    runs-on: ubuntu-latest
    environment: test
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_BACKEND_SERVICE_ID: ${{ vars.RAILWAY_BACKEND_SERVICE_ID }}
      RAILWAY_FRONTEND_SERVICE_ID: ${{ vars.RAILWAY_FRONTEND_SERVICE_ID }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point test tags to this commit
        env:
          SOURCE_TAG: sha-${{ github.sha }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${GITHUB_REPOSITORY}-backend:test" \
            "ghcr.io/${GITHUB_REPOSITORY}-backend:${SOURCE_TAG}"
          docker buildx imagetools create \
            --tag "ghcr.io/${GITHUB_REPOSITORY}-frontend:test" \
            "ghcr.io/${GITHUB_REPOSITORY}-frontend:${SOURCE_TAG}"

      - name: Link Railway test environment
        run: npx --yes @railway/cli@latest link --project "$RAILWAY_PROJECT_ID" --environment test

      - name: Redeploy test backend and frontend
        run: |
          npx --yes @railway/cli@latest redeploy --service "$RAILWAY_BACKEND_SERVICE_ID" --yes
          npx --yes @railway/cli@latest redeploy --service "$RAILWAY_FRONTEND_SERVICE_ID" --yes

